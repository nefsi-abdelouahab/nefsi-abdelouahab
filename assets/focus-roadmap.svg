<svg xmlns="http://www.w3.org/2000/svg" width="500" height="397" viewBox="0 0 500 397" role="img" aria-labelledby="title desc">
<title id="title">Current focus — roadmap</title>
<desc id="desc">Current focus: 1. Deepening my understanding of Machine Learning and Data Science. 2. Exploring LLMs, RAG, and AI Agent architectures. 3. Building practical AI-powered applications. 4. Improving software architecture and full-stack engineering skills. 5. Participating in AI/ML projects and research opportunities.</desc>
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
.fadein{animation:fadein .6s ease-out both}
.float{animation:float 5s ease-in-out infinite}
.drift{animation:drift 11s ease-in-out infinite alternate}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-26px,16px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.grow{transform-box:fill-box;transform-origin:top;animation:grow 1.2s cubic-bezier(.22,1,.36,1) .25s both}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.travel{opacity:0;animation:travel 6.0s linear 1.4s infinite}@keyframes travel{0%{opacity:0;transform:translateY(0)}6%{opacity:1}94%{opacity:1}100%{opacity:0;transform:translateY(280px)}}.ring{opacity:0;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{opacity:.7;transform:scale(1)}22%{opacity:0;transform:scale(2.3)}100%{opacity:0;transform:scale(2.3)}}</style>
