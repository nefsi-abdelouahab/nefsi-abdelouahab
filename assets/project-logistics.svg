<text class="sans fadein" style="animation-delay:0.62s" x="22" y="252" font-size="11.5" font-style="italic" fill="#AAA6C3">Additional project details are confidential.</text>
<g class="fadein" style="animation-delay:0.72s"><rect x="22.0" y="268" width="55.0" height="24" rx="12" fill="#915EFF" fill-opacity=".12" stroke="#915EFF" stroke-opacity=".4"/><text x="49.5" y="284.0" text-anchor="middle" class="mono" font-size="11" fill="#D9D3FF">React</text></g>
