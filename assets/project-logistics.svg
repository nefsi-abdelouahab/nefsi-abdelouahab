<g class="rise" style="animation-delay:0.46s"><path d="M23 196 l4 4 -4 4" fill="none" stroke="#915EFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="204" class="sans" font-size="12.5" fill="#CFCBE6">Approval, assignment, and commission management</text></g>
