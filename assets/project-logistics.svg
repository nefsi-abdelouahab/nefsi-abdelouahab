<g class="fadein" style="animation-delay:0.82s"><rect x="179.0" y="268" width="101.2" height="24" rx="12" fill="#915EFF" fill-opacity=".12" stroke="#915EFF" stroke-opacity=".4"/><text x="229.6" y="284.0" text-anchor="middle" class="mono" font-size="11" fill="#D9D3FF">React Native</text></g>
<g class="fadein" style="animation-delay:0.87s"><rect x="287.2" y="268" width="68.2" height="24" rx="12" fill="#915EFF" fill-opacity=".12" stroke="#915EFF" stroke-opacity=".4"/><text x="321.3" y="284.0" text-anchor="middle" class="mono" font-size="11" fill="#D9D3FF">Laravel</text></g>
