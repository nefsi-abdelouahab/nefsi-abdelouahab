<g class="fadein" style="animation-delay:.35s"><rect x="78.0" y="50" width="98.4" height="20" rx="10" fill="#BF61FF" fill-opacity=".14" stroke="#BF61FF" stroke-opacity=".5"/><g transform="translate(87.0 54) scale(.5)"><path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="#D9D3FF" stroke-width="2" stroke-linecap="round"/><rect x="5" y="11" width="14" height="10" rx="2.5" fill="none" stroke="#D9D3FF" stroke-width="2"/><circle cx="12" cy="16" r="1.5" fill="#D9D3FF"/></g><text x="101.0" y="63.6" class="mono" font-size="9.5" letter-spacing=".6" fill="#D9D3FF">CONFIDENTIAL</text></g>
<g class="rise" style="animation-delay:.15s"><text x="22" y="96" class="sans" font-size="13" fill="#F3F3F3" fill-opacity=".92">Contributing as a Full-Stack Developer within a</text><text x="22" y="115" class="sans" font-size="13" fill="#F3F3F3" fill-opacity=".92">development team to a confidential business</text><text x="22" y="134" class="sans" font-size="13" fill="#F3F3F3" fill-opacity=".92">logistics system.</text></g>
<g class="rise" style="animation-delay:0.30s"><path d="M23 152 l4 4 -4 4" fill="none" stroke="#915EFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="160" class="sans" font-size="12.5" fill="#CFCBE6">Web and mobile application development</text></g>
