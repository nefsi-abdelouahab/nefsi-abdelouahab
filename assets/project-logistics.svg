<svg xmlns="http://www.w3.org/2000/svg" width="400" height="314" viewBox="0 0 400 314" role="img" aria-labelledby="title desc">
<title id="title">Logistics Management System</title>
<desc id="desc">Logistics Management System (confidential). Contributing as a Full-Stack Developer within a development team to a confidential business logistics system. Web and mobile application development. Backend and database-driven business workflows. Approval, assignment, and commission management. Business logic analysis and improvement. Additional project details are confidential. Stack: React, TypeScript, React Native, Laravel.</desc>
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
.fadein{animation:fadein .6s ease-out both}
.float{animation:float 5s ease-in-out infinite}
.drift{animation:drift 11s ease-in-out infinite alternate}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-26px,16px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.strip-sheen{animation:strip 6s ease-in-out 1.2s infinite}
@keyframes strip{0%{transform:translateX(0)}45%,100%{transform:translateX(490px)}}
</style>
<defs>
  <linearGradient id="nf-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#151030"/><stop offset="1" stop-color="#100D25"/>
  </linearGradient>
  <radialGradient id="nf-glow">
    <stop offset="0" stop-color="#BF61FF" stop-opacity=".26"/><stop offset="1" stop-color="#BF61FF" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="nf-card"><rect width="400" height="314" rx="16"/></clipPath>
</defs>
<g clip-path="url(#nf-card)">
  <rect width="400" height="314" fill="url(#nf-bg)"/>
  <circle class="drift" cx="380" cy="304" r="130" fill="url(#nf-glow)"/>
</g>
<rect x=".5" y=".5" width="399" height="313" rx="15.5" fill="none" stroke="#362566"/>
<defs>
  <linearGradient id="nf-strip" x1="0" x2="1"><stop offset="0" stop-color="#BF61FF"/><stop offset="1" stop-color="#915EFF"/></linearGradient>
  <linearGradient id="nf-sheen" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#nf-card)">
  <rect width="400" height="3" fill="url(#nf-strip)"/>
  <rect class="strip-sheen" x="-90" y="0" width="90" height="3" fill="url(#nf-sheen)"/>
</g>
