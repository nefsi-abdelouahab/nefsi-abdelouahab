<svg xmlns="http://www.w3.org/2000/svg" width="400" height="295" viewBox="0 0 400 295" role="img" aria-labelledby="title desc">
<title id="title">Khdamli</title>
<desc id="desc">Khdamli — Home Services Mobile Application. A mobile platform connecting customers with skilled service providers in Algeria. Service listings and provider discovery. Job requests and user workflows. Developed as part of a six-member ESI-SBA student team. Stack: React Native, TypeScript, Expo, NativeWind.</desc>
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
.fadein{animation:fadein .6s ease-out both}
.float{animation:float 5s ease-in-out infinite}
.drift{animation:drift 11s ease-in-out infinite alternate}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-26px,16px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.strip-sheen{animation:strip 6s ease-in-out 1.2s infinite}
@keyframes strip{0%{transform:translateX(0)}45%,100%{transform:translateX(490px)}}
</style>
<defs>
  <linearGradient id="nf-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#151030"/><stop offset="1" stop-color="#100D25"/>
  </linearGradient>
  <radialGradient id="nf-glow">
    <stop offset="0" stop-color="#00CEA8" stop-opacity=".26"/><stop offset="1" stop-color="#00CEA8" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="nf-card"><rect width="400" height="295" rx="16"/></clipPath>
</defs>
<g clip-path="url(#nf-card)">
  <rect width="400" height="295" fill="url(#nf-bg)"/>
  <circle class="drift" cx="380" cy="285" r="130" fill="url(#nf-glow)"/>
</g>
<rect x=".5" y=".5" width="399" height="294" rx="15.5" fill="none" stroke="#362566"/>
<defs>
  <linearGradient id="nf-strip" x1="0" x2="1"><stop offset="0" stop-color="#00CEA8"/><stop offset="1" stop-color="#56CCF2"/></linearGradient>
  <linearGradient id="nf-sheen" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#nf-card)">
  <rect width="400" height="3" fill="url(#nf-strip)"/>
  <rect class="strip-sheen" x="-90" y="0" width="90" height="3" fill="url(#nf-sheen)"/>
</g>
<g class="rise" style="animation-delay:.05s"><rect x="22" y="24" width="42" height="42" rx="12" fill="#00CEA8" fill-opacity=".16" stroke="#00CEA8" stroke-opacity=".55"/><text x="43" y="51.5" text-anchor="middle" class="sans" font-size="19" font-weight="700" fill="#F3F3F3">K</text><text x="78" y="42" class="sans" font-size="18" font-weight="700" fill="#F3F3F3">Khdamli</text><text x="78" y="61" class="sans" font-size="12.5" fill="#AAA6C3">Home Services Mobile Application</text></g>
<g class="fadein" style="animation-delay:.35s" transform="translate(362 26)"><path d="M3 13 13 3M5 3h8v8" fill="none" stroke="#AAA6C3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="rise" style="animation-delay:.15s"><text x="22" y="96" class="sans" font-size="13" fill="#F3F3F3" fill-opacity=".92">A mobile platform connecting customers</text><text x="22" y="115" class="sans" font-size="13" fill="#F3F3F3" fill-opacity=".92">with skilled service providers in Algeria.</text></g>
<g class="rise" style="animation-delay:0.30s"><path d="M23 133 l4 4 -4 4" fill="none" stroke="#56CCF2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="141" class="sans" font-size="12.5" fill="#CFCBE6">Service listings and provider discovery</text></g>
<g class="rise" style="animation-delay:0.38s"><path d="M23 155 l4 4 -4 4" fill="none" stroke="#56CCF2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="163" class="sans" font-size="12.5" fill="#CFCBE6">Job requests and user workflows</text></g>
<g class="rise" style="animation-delay:0.46s"><path d="M23 177 l4 4 -4 4" fill="none" stroke="#56CCF2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="185" class="sans" font-size="12.5" fill="#CFCBE6">Developed as part of a</text><text x="36" y="203" class="sans" font-size="12.5" fill="#CFCBE6">six-member ESI-SBA student team</text></g>
<g class="fadein" style="animation-delay:0.64s"><rect x="22.0" y="249" width="101.2" height="24" rx="12" fill="#56CCF2" fill-opacity=".12" stroke="#56CCF2" stroke-opacity=".4"/><text x="72.6" y="265.0" text-anchor="middle" class="mono" font-size="11" fill="#D9D3FF">React Native</text></g>
<g class="fadein" style="animation-delay:0.69s"><rect x="130.2" y="249" width="88.0" height="24" rx="12" fill="#56CCF2" fill-opacity=".12" stroke="#56CCF2" stroke-opacity=".4"/><text x="174.2" y="265.0" text-anchor="middle" class="mono" font-size="11" fill="#D9D3FF">TypeScript</text></g>
<g class="fadein" style="animation-delay:0.74s"><rect x="225.2" y="249" width="48.4" height="24" rx="12" fill="#56CCF2" fill-opacity=".12" stroke="#56CCF2" stroke-opacity=".4"/><text x="249.4" y="265.0" text-anchor="middle" class="mono" font-size="11" fill="#D9D3FF">Expo</text></g>
<g class="fadein" style="animation-delay:0.79s"><rect x="280.6" y="249" width="88.0" height="24" rx="12" fill="#56CCF2" fill-opacity=".12" stroke="#56CCF2" stroke-opacity=".4"/><text x="324.6" y="265.0" text-anchor="middle" class="mono" font-size="11" fill="#D9D3FF">NativeWind</text></g>
</svg>
