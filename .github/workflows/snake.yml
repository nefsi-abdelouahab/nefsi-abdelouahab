# Generates the images README.md reads from the "output" branch:
#   github-snake.svg / github-snake-dark.svg   the contribution-graph snake (Platane/snk)
#   github-stats.svg / github-top-langs.svg    GitHub Readme Stats cards, generated here because the
#                                              public github-readme-stats.vercel.app instance is paused
#                                              and upstream recommends this action instead
#   github-streak.svg                          the streak card, generated here with STATS_TOKEN because
#                                              the hosted streak-stats.demolab.com card can only count
#                                              public contributions
# All five are published together in one push: ghaction-github-pages replaces the whole branch, so a
# second workflow pushing to "output" would delete this one's files.
name: Generate profile images

on:
  schedule:
    - cron: "0 0 * * *" # once a day, 00:00 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write # needed to push to the "output" branch

concurrency:
  group: profile-images
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Violet dots in the profile palette (#915EFF / #6D3FE0); cyan #56CCF2 and blue #2F80ED snakes.
          outputs: |
            dist/github-snake.svg?color_snake=#2F80ED&color_dots=#EBEDF0,#D9CCFF,#B79CFF,#9670F5,#6D3FE0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#56CCF2&color_dots=#161B22,#2E2160,#4B3399,#6E45D6,#915EFF

      # fail_on_error stops the run instead of publishing a "Something went wrong" card, so a GitHub
      # API hiccup leaves yesterday's cards on the output branch rather than replacing them.
      - name: Generate the stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=100D25&title_color=F3F3F3&text_color=AAA6C3&icon_color=56CCF2&ring_color=915EFF&border_color=362566&border_radius=16
          path: dist/github-stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: "true"

      - name: Generate the top-languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=100D25&title_color=F3F3F3&text_color=AAA6C3&border_color=362566&border_radius=16
          path: dist/github-top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: "true"

      # Same colours as the card it replaces. The action exits with an error instead of writing an
      # error card, so a failed fetch also leaves yesterday's card on the output branch.
      - name: Generate the streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&background=100D25&border=362566&stroke=362566&ring=915EFF&fire=56CCF2&currStreakNum=F3F3F3&sideNums=F3F3F3&currStreakLabel=56CCF2&sideLabels=AAA6C3&dates=AAA6C3&border_radius=16
          path: dist/github-streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile images"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
